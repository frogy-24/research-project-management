<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR + LLM - Trích xuất thông tin từ ảnh</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 OCR + LLM Assistant</h1>
            <p>Trích xuất thông tin thông minh từ ảnh với PaddleOCR & AI</p>
        </div>
        
        <div class="content">
            <div class="upload-section">
                <h2 style="margin-bottom: 20px;">📤 Upload Ảnh</h2>
                
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('file')">Upload File</button>
                    <button class="tab-btn" onclick="switchTab('url')">URL Ảnh</button>
                </div>
                
                <div id="file-tab" class="tab-content active">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="upload-box">
                            <label for="fileInput" class="upload-label">
                                📁 Chọn Ảnh
                            </label>
                            <input type="file" id="fileInput" name="file" accept="image/*">
                            <p id="fileName" style="margin-top: 15px; color: #666;"></p>
                        </div>
                        <button type="submit" class="submit-btn" style="margin-top: 20px;">
                            🚀 Phân Tích Ảnh
                        </button>
                    </form>
                </div>
                
                <div id="url-tab" class="tab-content">
                    <form id="urlForm">
                        <input type="url" class="url-input" id="imageUrl" 
                               placeholder="Nhập URL ảnh (https://...)" required>
                        <button type="submit" class="submit-btn">
                            🚀 Phân Tích Ảnh từ URL
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: #667eea; font-weight: bold;">
                    Đang xử lý ảnh...
                </p>
            </div>
            
            <div class="results" id="results">
                <div class="result-box">
                    <h3>📸 Ảnh đã upload</h3>
                    <img id="previewImage" class="preview-image" alt="Preview">
                </div>
                
                <div class="result-box">
                    <h3>📝 Văn bản OCR</h3>
                    <pre id="ocrText"></pre>
                </div>
                
                <div class="result-box">
                    <h3>🤖 Thông tin trích xuất (AI)</h3>
                    <pre id="extractedInfo"></pre>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
